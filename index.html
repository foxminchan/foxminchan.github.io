    <!-- Dynamic Origin Synchronizer for Preview & Custom Domains -->
    <script>
      (function () {
        if (typeof window !== 'undefined' && window.location.origin) {
          var origin = window.location.origin;
          var canonical = document.querySelector('link[rel="canonical"]');
          if (canonical && !canonical.href.includes('github.io')) {
            canonical.href = origin + window.location.pathname;
          }
          var ogUrl = document.querySelector('meta[property="og:url"]');
          if (ogUrl && !ogUrl.content.includes('github.io')) {
            ogUrl.content = origin + window.location.pathname;
          }
        }
      })();
    </script>
